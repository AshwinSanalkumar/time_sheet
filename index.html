<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker | Office Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .log-scroll::-webkit-scrollbar { width: 4px; }
        .log-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="glass max-w-md w-full rounded-3xl shadow-2xl p-8 border border-white">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-1">Office Timer</h1>
        
        <div id="shiftStart" class="text-center text-xs text-slate-400 font-medium mb-5">
            Not clocked in yet
        </div>
        
        <div class="flex justify-center mb-6">
            <span id="statusBadge" class="px-4 py-1 rounded-full text-sm font-bold bg-slate-200 text-slate-600 uppercase tracking-widest">
                Clocked Out
            </span>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-blue-50 p-4 rounded-2xl text-center border border-blue-100">
                <p class="text-xs text-blue-600 font-bold uppercase">Work Time</p>
                <p id="workClock" class="text-2xl font-mono font-bold text-blue-900">00:00:00</p>
            </div>
            <div class="bg-orange-50 p-4 rounded-2xl text-center border border-orange-100">
                <p class="text-xs text-orange-600 font-bold uppercase">Break Time</p>
                <p id="breakClock" class="text-2xl font-mono font-bold text-orange-900">00:00:00</p>
            </div>
        </div>

        <div class="mb-8">
            <div class="flex justify-between text-xs font-bold mb-2">
                <span class="text-slate-500 uppercase">Progress</span>
                <span id="progressPercent" class="text-blue-600">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-3">
                <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="remainingTime" class="text-center text-sm text-slate-500 mt-3 font-medium"></p>
        </div>

        <div id="controls" class="space-y-3">
            <button id="btnMain" onclick="handleMainAction()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold shadow-lg transition-all active:scale-95">
                Time In
            </button>
            <button id="btnBreak" onclick="handleBreakAction()" class="hidden w-full py-4 bg-white border-2 border-orange-400 text-orange-600 hover:bg-orange-50 rounded-2xl font-bold transition-all active:scale-95">
                Take Break
            </button>

            <div class="mt-6 pt-6 border-t border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 text-center">Break Analysis</p>
                <div class="max-h-40 overflow-y-auto log-scroll border rounded-xl bg-white/50">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] uppercase text-slate-500 font-bold">
                            <tr>
                                <th class="px-3 py-2">Start</th>
                                <th class="px-3 py-2">End</th>
                                <th class="px-3 py-2 text-right">Dur.</th>
                            </tr>
                        </thead>
                        <tbody id="breakTableBody" class="text-[11px] text-slate-600">
                            </tbody>
                    </table>
                </div>
            </div>

            <button onclick="resetDay()" class="w-full py-2 text-slate-400 text-xs hover:text-red-500 transition-colors mt-4">
                Reset Day
            </button>
        </div>
    </div>

    <script>
        const defaultState = {
            status: 'OUT',
            totalWorkMs: 0,
            totalBreakMs: 0,
            lastTimestamp: null,
            startTime: null,
            breaks: [],
            notified: false
        };

        let state = JSON.parse(localStorage.getItem('timerState')) || defaultState;
        if (!state.breaks) state.breaks = [];

        const TARGET_MS = 8 * 60 * 60 * 1000;

        function save() {
            localStorage.setItem('timerState', JSON.stringify(state));
        }

        function formatTime(ms) {
            let s = Math.floor(ms / 1000);
            let m = Math.floor(s / 60);
            let h = Math.floor(m / 60);
            return [h, m % 60, s % 60].map(v => v.toString().padStart(2, '0')).join(':');
        }

        function formatDuration(ms) {
            let s = Math.floor(ms / 1000);
            let m = Math.floor(s / 60);
            return m > 0 ? `${m}m ${s % 60}s` : `${s}s`;
        }

        function getClockTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function requestNotify() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
        }

        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body, icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png" });
            }
        }

        function renderLogs() {
            const tableBody = document.getElementById('breakTableBody');
            const shiftText = document.getElementById('shiftStart');
            shiftText.innerText = state.startTime ? `Shift started at: ${state.startTime}` : "Not clocked in yet";

            if (state.breaks.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="3" class="px-3 py-4 text-center text-slate-400 italic">No logs yet</td></tr>';
                return;
            }

            tableBody.innerHTML = state.breaks.map(b => `
                <tr class="border-b border-slate-50 last:border-0">
                    <td class="px-3 py-2 font-mono text-slate-400">${b.start}</td>
                    <td class="px-3 py-2 font-mono text-slate-400">${b.end || '...'}</td>
                    <td class="px-3 py-2 text-right font-bold text-orange-500">${b.duration ? formatDuration(b.duration) : '--'}</td>
                </tr>
            `).join('');
        }

        function updateUI() {
            const now = Date.now();
            let liveWork = state.totalWorkMs;
            let liveBreak = state.totalBreakMs;

            if (state.status === 'WORKING' && state.lastTimestamp) {
                liveWork += (now - state.lastTimestamp);
            } else if (state.status === 'BREAK' && state.lastTimestamp) {
                liveBreak += (now - state.lastTimestamp);
            }

            document.getElementById('workClock').innerText = formatTime(liveWork);
            document.getElementById('breakClock').innerText = formatTime(liveBreak);
            
            const progress = Math.min(100, (liveWork / TARGET_MS) * 100);
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressPercent').innerText = Math.floor(progress) + '%';
            
            const remaining = Math.max(0, TARGET_MS - liveWork);
            document.getElementById('remainingTime').innerText = remaining > 0 ? 
                `Left: ${formatTime(remaining)}` : "Goal Reached! 🎉";

            // Notification Trigger
            if (progress >= 100 && !state.notified) {
                sendNotification("Work Goal Reached!", "You've officially completed 8 hours. Great work!");
                state.notified = true;
                save();
            }

            const badge = document.getElementById('statusBadge');
            const btnMain = document.getElementById('btnMain');
            const btnBreak = document.getElementById('btnBreak');

            if (state.status === 'WORKING') {
                badge.innerText = "Working";
                badge.className = "px-4 py-1 rounded-full text-sm font-bold bg-green-100 text-green-600 uppercase tracking-widest";
                btnMain.innerText = "Clock Out";
                btnMain.className = "w-full py-4 bg-red-500 text-white rounded-2xl font-bold shadow-lg";
                btnBreak.classList.remove('hidden');
                btnBreak.innerText = "Take Break";
                btnBreak.className = "w-full py-4 bg-white border-2 border-orange-400 text-orange-600 rounded-2xl font-bold transition-all active:scale-95";
            } else if (state.status === 'BREAK') {
                badge.innerText = "On Break";
                badge.className = "px-4 py-1 rounded-full text-sm font-bold bg-orange-100 text-orange-600 uppercase tracking-widest";
                btnMain.classList.add('hidden');
                btnBreak.classList.remove('hidden');
                btnBreak.innerText = "Resume Work";
                btnBreak.className = "w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg transition-all active:scale-95";
            } else {
                badge.innerText = "Clocked Out";
                badge.className = "px-4 py-1 rounded-full text-sm font-bold bg-slate-200 text-slate-600 uppercase tracking-widest";
                btnMain.classList.remove('hidden');
                btnMain.innerText = "Time In";
                btnMain.className = "w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg transition-all active:scale-95";
                btnBreak.classList.add('hidden');
            }
        }

        function handleMainAction() {
            requestNotify(); // Prompt for permission on first interaction
            const now = Date.now();
            if (state.status === 'OUT') {
                state.status = 'WORKING';
                state.lastTimestamp = now;
                if (!state.startTime) state.startTime = getClockTime();
            } else if (state.status === 'WORKING') {
                state.totalWorkMs += (now - state.lastTimestamp);
                state.status = 'OUT';
                state.lastTimestamp = null;
            }
            save();
            renderLogs();
            updateUI();
        }

        function handleBreakAction() {
            const now = Date.now();
            if (state.status === 'WORKING') {
                state.totalWorkMs += (now - state.lastTimestamp);
                state.status = 'BREAK';
                state.lastTimestamp = now;
                state.breaks.unshift({ start: getClockTime(), end: null, duration: null, startMs: now });
            } else if (state.status === 'BREAK') {
                const dur = now - state.lastTimestamp;
                state.totalBreakMs += dur;
                state.status = 'WORKING';
                state.lastTimestamp = now;
                if (state.breaks[0]) {
                    state.breaks[0].end = getClockTime();
                    state.breaks[0].duration = dur;
                }
            }
            save();
            renderLogs();
            updateUI();
        }

        function resetDay() {
            if(confirm("Reset logs and timer?")) {
                state = { ...defaultState, breaks: [] };
                save();
                renderLogs();
                updateUI();
            }
        }

        renderLogs();
        updateUI();
        setInterval(updateUI, 1000);
    </script>
</body>
</html>
